name: Sync backend to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Sync backend to Hugging Face Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Loop12/tomatku-be
          repo_type: space
          space_sdk: gradio
          subdirectory: apps/backend
          hf_token: ${{ secrets.HF_TOKEN }}
